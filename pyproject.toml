[project]
name = "cyberarena"
version = "0.1.0"
description = "Multi-agent AI cyber defense simulation: LLM Red Team vs LLM Blue Team investigation pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3.0",
    "langchain>=0.3.7",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.2.14",
    "langchain-anthropic>=0.2.15",
    "langchain-google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"